<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheetPT — Spreadsheet Intelligence Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="bg-mesh"></div>
<div class="bg-spot" id="bgSpot"></div>
<div class="bg-halo" id="bgHalo"></div>

<header class="topbar">
  <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar">
    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>
  <span class="logo-mark">
    <svg viewBox="0 0 32 32" width="22" height="22"><rect x="1" y="1" width="30" height="30" rx="6" fill="#2e8b62"/><path d="M8 23h16M8 16h16M8 9h16" stroke="#14181c" stroke-width="2.4" stroke-linecap="round"/></svg>
  </span>
  <span class="wordmark">SheetPT</span>
  <div class="topbar-spacer"></div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <button id="newTaskBtn" class="new-task">+ New task</button>

    <p class="micro-label">History</p>
    <ul id="historyList" class="history-list"><li class="muted">No runs yet</li></ul>

    <p class="micro-label" style="margin-top:22px">Input files</p>
    <ul id="inputList" class="file-list"></ul>

    <p class="micro-label" style="margin-top:18px">Output files</p>
    <ul id="outputList" class="file-list"></ul>
  </aside>

  <main class="main" id="main">
    <div id="hero" class="hero">
      <div class="hero-logo">
        <svg viewBox="0 0 64 64" width="56" height="56"><rect x="2" y="2" width="60" height="60" rx="14" fill="#2e8b62"/><path d="M16 46h32M16 32h32M16 18h32" stroke="#14181c" stroke-width="4.5" stroke-linecap="round"/></svg>
      </div>
      <h1>What can I analyze for you?</h1>
      <p>Upload a spreadsheet, describe the task in plain language, and SheetPT writes and executes the code.</p>
    </div>

    <div id="chat" class="chat"></div>

    <div id="composerWrap" class="composer-wrap">
      <div class="composer">
        <div id="chips" class="chips"></div>
        <div class="composer-row">
          <button id="attachBtn" class="icon-btn attach" title="Attach file">+</button>
          <textarea id="promptInput" rows="1" placeholder="Ask SheetPT anything about your data…"></textarea>
          <select id="modelSelect" class="model-select-inline" title="Model"></select>
          <button id="runBtn" class="send-btn" title="Run">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 19V5m0 0l-6 6m6-6l6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
        <input id="fileInput" type="file" hidden accept=".csv,.xlsx,.xls,.json,.parquet" multiple>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
